name: "Renovate Update"
permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3,4 * * *"

jobs:
  renovate:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: debug
    permissions:
      contents: read
      pull-requests: write
      issues: write
      security-events: read
      # allow the action to create branches and PRs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.1.21
        env:
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_BOT_GITHUB_TOKEN }}
          RENOVATE_DEPENDENCY_DASHBOARD_REPORT_ABANDONMENT: true
          RENOVATE_DEPENDENCY_DASHBOARD_HEADER: '<img alt="service cat renovate judge" src="https://uvulpos.github.io/public-assets/dcs-software/renovate-bot/hero-section-image-wide-cut%20(3).png" width="100%">'
        with:
          docker-user: root
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_BOT_GITHUB_TOKEN }}
