@goimports = go run golang.org/x/tools/cmd/goimports

src/**/* {
    prep: swag fmt -g src/web-app/app.go && swag init -g src/web-app/app.go -o swagger-docs
    # daemon +sigterm: dlv debug --accept-multiclient --log --headless --listen 0.0.0.0:2345 --build-flags "-gcflags='all=-N -l'" --continue src/main.go |&pp
    daemon +sigterm: go run src/main.go run |&pp
}