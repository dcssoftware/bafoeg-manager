services:
  minio:
    image: quay.io/minio/minio:latest
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9005/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - intranet
    ports:
      - "9005:9005"
      - "9010:9010"
    restart: always
    volumes:
      - "app-minio:/data"
    environment:
      MINIO_ROOT_USER: "minio"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: server /data --console-address ":9005" --address ":9010"

volumes:
  app-minio:
